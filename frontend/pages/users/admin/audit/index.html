<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security & Audit Logs - Admin Control Center</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body
  class="bg-neutral-100 dark:bg-[#16171d] text-neutral-800 dark:text-neutral-100 min-h-screen transition-colors duration-300">

  <div id="app" class="min-h-screen">
    <div id="sidebar-container"></div>

    <main class="p-4 sm:ml-64 mt-14">
      <!-- Header Row -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-black text-neutral-900 dark:text-white tracking-tight uppercase">Security & Activity Audit Logs</h1>
            <span class="px-2 py-0.5 text-[10px] font-black uppercase tracking-wider bg-rose-100 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-300 dark:border-rose-800">GMT+08 Standard</span>
          </div>
          <p class="text-xs text-neutral-500 dark:text-neutral-400">Chronological security events, authentication attempts, merchant tier modifications, and IP tracking.</p>
        </div>

        <button id="btn-refresh-audit" type="button"
          class="cursor-pointer inline-flex items-center gap-1.5 px-4 py-2.5 bg-neutral-900 dark:bg-neutral-100 hover:bg-neutral-800 dark:hover:bg-white text-white dark:text-neutral-900 text-xs font-black uppercase tracking-wider rounded-none transition shadow-xs active:scale-95">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span>Refresh Live Audit</span>
        </button>
      </div>

      <!-- SECTION: Audit Logs Table -->
      <section id="section-audit" class="space-y-4">
        <div class="bg-white dark:bg-[#16171d] border border-neutral-200 dark:border-neutral-800 overflow-x-auto shadow-xs">
          <table class="w-full text-xs text-left text-neutral-600 dark:text-neutral-300">
            <thead class="text-[11px] font-black uppercase tracking-wider text-neutral-700 dark:text-neutral-300 bg-neutral-50 dark:bg-neutral-900/60 border-b border-neutral-200 dark:border-neutral-800">
              <tr>
                <th scope="col" class="px-4 py-3.5">Timestamp (GMT+08)</th>
                <th scope="col" class="px-4 py-3.5">Action Event</th>
                <th scope="col" class="px-4 py-3.5">Actor & Role</th>
                <th scope="col" class="px-4 py-3.5">IP Address</th>
                <th scope="col" class="px-4 py-3.5">Description & Payload</th>
              </tr>
            </thead>
            <tbody id="audit-table-body" class="divide-y divide-neutral-200 dark:divide-neutral-800/60 font-medium font-mono text-[11px]">
              <!-- Dynamically injected via admin-dashboard.js -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
