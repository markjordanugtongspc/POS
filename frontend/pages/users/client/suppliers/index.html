<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorgy POS - Suppliers Directory</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body class="bg-neutral-100 dark:bg-[#16171d] text-neutral-800 dark:text-neutral-100 min-h-screen transition-colors duration-300 font-sans">
  <div id="app" class="min-h-screen">
    <!-- Sidebar & Top Navbar injected dynamically via main.js -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <div class="p-4 sm:ml-64 mt-14 h-[calc(100vh-3.5rem)] flex flex-col gap-6 overflow-y-auto custom-scrollbar">

      <!-- Header Section -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mt-2 shrink-0">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-neutral-900 dark:text-white tracking-tight">Suppliers</h1>
          <p id="supplier-count-subtitle" class="text-xs font-bold text-neutral-500 dark:text-neutral-400 mt-1">0 suppliers</p>
        </div>

        <!-- Add Supplier Action Button -->
        <button type="button" id="btn-open-add-supplier" data-drawer-open="supplier-drawer"
          class="cursor-pointer w-full sm:w-auto px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-sm rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>Add supplier</span>
        </button>
      </div>

      <!-- Search & Filters -->
      <div class="bg-white dark:bg-[#1f2029] border border-neutral-200 dark:border-neutral-800 p-4 rounded-2xl shadow-xs shrink-0 flex items-center gap-3">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none text-neutral-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </div>
          <input type="text" id="search-suppliers-input" placeholder="Search by supplier name or contact person..."
            class="w-full pl-10 pr-4 py-2 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl text-xs font-semibold text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all placeholder-neutral-400">
        </div>
      </div>

      <!-- Suppliers Grid / Content Container -->
      <div id="suppliers-list-container" class="flex-1">
        <!-- Rendered dynamically via suppliers.js (empty state or cards grid) -->
      </div>

    </div>
  </div>

  <!-- Add/Edit Supplier Drawer (Right Off-Canvas matching Cart and Receipt Drawers) -->
  <div id="supplier-drawer" tabindex="-1" aria-labelledby="supplier-drawer-title"
    class="fixed inset-y-0 right-0 z-[60] w-full sm:w-96 md:w-[420px] max-w-full p-6 overflow-y-auto transition-transform duration-300 translate-x-full bg-white dark:bg-[#16171d] border-l border-neutral-200 dark:border-neutral-800 shadow-2xl flex flex-col justify-between font-sans">
    
    <div>
      <!-- Drawer Header -->
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-neutral-200 dark:border-neutral-800">
        <h3 id="supplier-drawer-title" class="text-base font-extrabold text-neutral-900 dark:text-white">Add supplier</h3>
        <button type="button" data-drawer-close="supplier-drawer" aria-controls="supplier-drawer"
          class="cursor-pointer text-neutral-400 hover:text-neutral-700 dark:hover:text-white p-1 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Drawer Form Formatted per [IMAGE 2] -->
      <form id="supplier-form" class="space-y-4 text-xs font-semibold" onsubmit="event.preventDefault();">
        <input type="hidden" id="supplier-id" value="">

        <div>
          <label for="supplier-name" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Supplier name *</label>
          <input type="text" id="supplier-name" required placeholder="e.g. Coca-Cola Bottlers"
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="supplier-contact-person" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Contact person</label>
            <input type="text" id="supplier-contact-person" placeholder="e.g. Juan Dela Cruz"
              class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
          <div>
            <label for="supplier-phone" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Contact number</label>
            <input type="text" id="supplier-phone" placeholder="e.g. 0917-123-4567"
              class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
        </div>

        <div>
          <label for="supplier-email" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Email (optional)</label>
          <input type="email" id="supplier-email" placeholder="e.g. orders@supplier.com"
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
        </div>

        <div>
          <label for="supplier-notes" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Notes (optional)</label>
          <textarea id="supplier-notes" rows="3" placeholder="Delivery schedule, minimum order, payment terms..."
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition resize-none"></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit-supplier"
          class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-sm rounded-xl shadow-md transition-all flex items-center justify-center cursor-pointer mt-2">
          Add supplier
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
