<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorgy POS - Utang & Credit Ledger</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body class="bg-neutral-100 dark:bg-[#16171d] text-neutral-800 dark:text-neutral-100 min-h-screen transition-colors duration-300 font-sans">
  <div id="app" class="min-h-screen">
    <!-- Sidebar & Top Navbar injected dynamically via main.js -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <div class="p-4 sm:ml-64 mt-14 h-[calc(100vh-3.5rem)] flex flex-col gap-6 overflow-y-auto custom-scrollbar">

      <!-- Header Section matching [IMAGE 3] -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mt-2 shrink-0">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-neutral-900 dark:text-white tracking-tight">Utang</h1>
          <p id="utang-customer-limit-subtitle" class="text-xs font-bold text-neutral-500 dark:text-neutral-400 mt-1">0 customers</p>
        </div>

        <!-- Add Utang Action Button -->
        <button type="button" id="btn-open-add-utang" data-drawer-open="utang-drawer"
          class="cursor-pointer w-full sm:w-auto px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-sm rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>Add utang</span>
        </button>
      </div>

      <!-- KPI Summary Cards matching [IMAGE 3] -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 shrink-0">
        <!-- Total Outstanding Utang Card -->
        <div class="bg-white dark:bg-[#1f2029] p-5 rounded-2xl border border-neutral-200 dark:border-neutral-800 shadow-xs flex flex-col justify-between">
          <span class="text-xs font-bold text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Total outstanding utang</span>
          <div class="mt-2">
            <h2 id="total-outstanding-utang-display" class="text-2xl sm:text-3xl font-black text-neutral-900 dark:text-white font-mono">₱0.00</h2>
            <span class="text-[11px] font-bold text-neutral-400">Total active credit balances</span>
          </div>
        </div>

        <!-- Overdue Customers Card -->
        <div class="bg-white dark:bg-[#1f2029] p-5 rounded-2xl border border-neutral-200 dark:border-neutral-800 shadow-xs flex flex-col justify-between">
          <span class="text-xs font-bold text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Overdue customers</span>
          <div class="mt-2">
            <h2 id="overdue-customers-count-display" class="text-2xl sm:text-3xl font-black text-red-500 font-mono">0</h2>
            <span class="text-[11px] font-bold text-neutral-400">Past agreed due date</span>
          </div>
        </div>
      </div>

      <!-- Search Input matching [IMAGE 3] -->
      <div class="bg-white dark:bg-[#1f2029] border border-neutral-200 dark:border-neutral-800 p-4 rounded-2xl shadow-xs shrink-0 flex items-center gap-3">
        <div class="relative flex-1">
          <div class="absolute inset-y-0 start-0 flex items-center ps-3.5 pointer-events-none text-neutral-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </div>
          <input type="text" id="search-utang-input" placeholder="Search customer name..."
            class="w-full pl-10 pr-4 py-2 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl text-xs font-semibold text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all placeholder-neutral-400">
        </div>
      </div>

      <!-- Utang Records Content Container -->
      <div id="utang-list-container" class="flex-1">
        <!-- Rendered dynamically via utang.js (empty state or credit list) -->
      </div>

    </div>
  </div>

  <!-- Add/Edit Utang Drawer (Right Off-Canvas matching Cart and Receipt Drawers) -->
  <div id="utang-drawer" tabindex="-1" aria-labelledby="utang-drawer-title"
    class="fixed inset-y-0 right-0 z-[60] w-full sm:w-96 md:w-[420px] max-w-full p-6 overflow-y-auto transition-transform duration-300 translate-x-full bg-white dark:bg-[#16171d] border-l border-neutral-200 dark:border-neutral-800 shadow-2xl flex flex-col justify-between font-sans">
    
    <div>
      <!-- Drawer Header -->
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-neutral-200 dark:border-neutral-800">
        <h3 id="utang-drawer-title" class="text-base font-extrabold text-neutral-900 dark:text-white">Add utang</h3>
        <button type="button" data-drawer-close="utang-drawer" aria-controls="utang-drawer"
          class="cursor-pointer text-neutral-400 hover:text-neutral-700 dark:hover:text-white p-1 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Drawer Form Formatted per [IMAGE 4] -->
      <form id="utang-form" class="space-y-3.5 text-xs font-semibold" onsubmit="event.preventDefault();">
        <!-- Customer Selector -->
        <div>
          <label for="utang-customer-select" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Customer</label>
          <select id="utang-customer-select"
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
            <option value="NEW" selected>Register new customer</option>
          </select>
        </div>

        <!-- Customer Name Input -->
        <div id="utang-customer-name-wrapper">
          <label for="utang-customer-name" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Customer name *</label>
          <input type="text" id="utang-customer-name" required placeholder="e.g. Nena Cruz"
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
        </div>

        <!-- Customer Phone & Optional Email -->
        <div id="utang-customer-contact-wrapper" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label for="utang-customer-phone" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Phone number</label>
            <input type="text" id="utang-customer-phone" placeholder="e.g. 0917-000-1122"
              class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
          <div>
            <label for="utang-customer-email" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Email (optional)</label>
            <input type="email" id="utang-customer-email" placeholder="e.g. nena@mail.com"
              class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
        </div>

        <!-- What's being taken (item/description) -->
        <div>
          <label for="utang-items-description" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">What's being taken (item/description) *</label>
          <input type="text" id="utang-items-description" required placeholder="e.g. 2 Lucky Me, 1 Coke 1.5L"
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
        </div>

        <!-- Amount (₱) and Date added -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="utang-amount" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Amount (₱) *</label>
            <input type="number" step="0.01" min="0.01" id="utang-amount" required placeholder="0.00"
              class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white font-mono font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
          <div>
            <label for="utang-date-added" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Date added</label>
            <input type="date" id="utang-date-added"
              class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
        </div>

        <!-- Kailan babayaran (due date, optional) -->
        <div>
          <label for="utang-due-date" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Kailan babayaran (due date, optional)</label>
          <input type="date" id="utang-due-date"
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
        </div>

        <!-- Interactive HTML5 E-Signature Pad -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-neutral-700 dark:text-neutral-300 font-bold">Customer E-Signature (Optional)</label>
            <button type="button" id="btn-clear-signature" class="text-[10px] font-bold text-rose-500 hover:text-rose-600 transition cursor-pointer">
              Clear Signature
            </button>
          </div>
          <div class="w-full h-24 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl relative overflow-hidden flex items-center justify-center">
            <canvas id="utang-signature-pad" width="380" height="96" class="w-full h-full cursor-crosshair touch-none"></canvas>
            <span class="absolute bottom-1 right-2 text-[9px] text-neutral-400 select-none pointer-events-none">Sign with touch or mouse</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-submit-utang"
          class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-sm rounded-xl shadow-md transition-all flex items-center justify-center cursor-pointer mt-3">
          Add utang
        </button>
      </form>
    </div>
  </div>

  <!-- Settle Payment Drawer (Right Off-Canvas matching Cart and Receipt Drawers) -->
  <div id="utang-payment-drawer" tabindex="-1" aria-labelledby="utang-payment-title"
    class="fixed inset-y-0 right-0 z-[60] w-full sm:w-96 md:w-[420px] max-w-full p-6 overflow-y-auto transition-transform duration-300 translate-x-full bg-white dark:bg-[#16171d] border-l border-neutral-200 dark:border-neutral-800 shadow-2xl flex flex-col justify-between font-sans">
    
    <div>
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-neutral-200 dark:border-neutral-800">
        <h3 id="utang-payment-title" class="text-base font-extrabold text-neutral-900 dark:text-white">Record payment</h3>
        <button type="button" data-drawer-close="utang-payment-drawer" aria-controls="utang-payment-drawer"
          class="cursor-pointer text-neutral-400 hover:text-neutral-700 dark:hover:text-white p-1 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="utang-payment-form" class="space-y-4 text-xs font-semibold" onsubmit="event.preventDefault();">
        <input type="hidden" id="payment-utang-id" value="">

        <div class="p-3 bg-neutral-50 dark:bg-neutral-900 rounded-xl border border-neutral-200 dark:border-neutral-800 space-y-1">
          <span class="text-[11px] text-neutral-500 font-bold block">Customer Tab:</span>
          <p id="payment-customer-name-display" class="font-extrabold text-sm text-neutral-900 dark:text-white">-</p>
          <div class="flex justify-between items-center text-xs pt-1 border-t border-neutral-200 dark:border-neutral-800">
            <span class="text-neutral-500">Remaining Balance:</span>
            <span id="payment-remaining-balance-display" class="font-black text-rose-500 font-mono">₱0.00</span>
          </div>
        </div>

        <div>
          <label for="payment-amount-input" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Amount Paid (₱) *</label>
          <input type="number" step="0.01" min="0.01" id="payment-amount-input" required placeholder="0.00"
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white font-mono font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none transition text-base">
        </div>

        <div>
          <label for="payment-method-select" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Payment method</label>
          <select id="payment-method-select"
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
            <option value="cash" selected>Cash</option>
            <option value="gcash">GCash</option>
          </select>
        </div>

        <div>
          <label for="payment-notes" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Notes (optional)</label>
          <input type="text" id="payment-notes" placeholder="e.g. Partial settlement for rice"
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
        </div>

        <button type="submit" id="btn-submit-payment"
          class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-sm rounded-xl shadow-md transition-all flex items-center justify-center cursor-pointer mt-2">
          Confirm payment
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
