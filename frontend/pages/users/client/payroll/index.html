<!DOCTYPE html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorgy POS - Staff Payroll</title>
  <link rel="stylesheet" href="/src/style.css">
</head>

<body class="bg-neutral-100 dark:bg-[#16171d] text-neutral-800 dark:text-neutral-100 min-h-screen transition-colors duration-300 font-sans">
  <div id="app" class="min-h-screen">
    <!-- Sidebar & Top Navbar injected dynamically via main.js -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <div class="p-4 sm:ml-64 mt-14 h-[calc(100vh-3.5rem)] flex flex-col gap-6 overflow-y-auto custom-scrollbar">

      <!-- Header Section -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mt-2 shrink-0">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold text-neutral-900 dark:text-white tracking-tight">Staff Payroll</h1>
          <p class="text-xs font-bold text-neutral-500 dark:text-neutral-400 mt-1">Manage staff compensation, salaries, and pay slips</p>
        </div>

        <!-- Add Payroll Record Action Button -->
        <button type="button" id="btn-open-add-payroll" data-drawer-open="payroll-drawer"
          class="cursor-pointer w-full sm:w-auto px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-sm rounded-xl shadow-sm transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>Process Payroll</span>
        </button>
      </div>

      <!-- KPI Summary Cards -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 shrink-0">
        <div class="bg-white dark:bg-[#1f2029] p-5 rounded-2xl border border-neutral-200 dark:border-neutral-800 shadow-xs">
          <span class="text-xs font-bold text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Total Disbursed (Paid)</span>
          <h2 id="kpi-total-disbursed" class="text-2xl sm:text-3xl font-black text-emerald-600 dark:text-emerald-400 font-mono mt-1">₱0.00</h2>
        </div>

        <div class="bg-white dark:bg-[#1f2029] p-5 rounded-2xl border border-neutral-200 dark:border-neutral-800 shadow-xs">
          <span class="text-xs font-bold text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Pending Payables</span>
          <h2 id="kpi-pending-payables" class="text-2xl sm:text-3xl font-black text-amber-500 font-mono mt-1">₱0.00</h2>
        </div>

        <div class="bg-white dark:bg-[#1f2029] p-5 rounded-2xl border border-neutral-200 dark:border-neutral-800 shadow-xs">
          <span class="text-xs font-bold text-neutral-500 dark:text-neutral-400 uppercase tracking-wider">Active Staff Count</span>
          <h2 id="kpi-staff-count" class="text-2xl sm:text-3xl font-black text-neutral-900 dark:text-white font-mono mt-1">0</h2>
        </div>
      </div>

      <!-- Payroll Records Table Container -->
      <div class="bg-white dark:bg-[#1f2029] border border-neutral-200 dark:border-neutral-800 rounded-2xl shadow-xs overflow-hidden flex-1 flex flex-col">
        <div class="p-4 border-b border-neutral-200 dark:border-neutral-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
          <h3 class="font-extrabold text-sm text-neutral-900 dark:text-white">Payroll History & Vouchers</h3>
          <input type="text" id="search-payroll-input" placeholder="Search staff name..."
            class="w-full sm:w-64 px-3 py-1.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-lg text-xs font-semibold text-neutral-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div class="overflow-x-auto flex-1">
          <table class="w-full text-xs text-left text-neutral-600 dark:text-neutral-300">
            <thead class="text-[11px] text-neutral-500 uppercase bg-neutral-50 dark:bg-neutral-900/60 border-b border-neutral-200 dark:border-neutral-800 font-extrabold">
              <tr>
                <th scope="col" class="px-5 py-3">Staff Name</th>
                <th scope="col" class="px-5 py-3">Role</th>
                <th scope="col" class="px-5 py-3">Rate & Days</th>
                <th scope="col" class="px-5 py-3">Bonuses / Deductions</th>
                <th scope="col" class="px-5 py-3">Net Pay</th>
                <th scope="col" class="px-5 py-3">Status</th>
                <th scope="col" class="px-5 py-3 text-center">Action</th>
              </tr>
            </thead>
            <tbody id="payroll-table-body" class="divide-y divide-neutral-100 dark:divide-neutral-800 font-semibold">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <!-- Process Payroll Drawer (Right Off-Canvas matching Cart and Receipt Drawers) -->
  <div id="payroll-drawer" tabindex="-1" aria-labelledby="payroll-drawer-title"
    class="fixed inset-y-0 right-0 z-[60] w-full sm:w-96 md:w-[420px] max-w-full p-6 overflow-y-auto transition-transform duration-300 translate-x-full bg-white dark:bg-[#16171d] border-l border-neutral-200 dark:border-neutral-800 shadow-2xl flex flex-col justify-between font-sans">
    
    <div>
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-neutral-200 dark:border-neutral-800">
        <h3 id="payroll-drawer-title" class="text-base font-extrabold text-neutral-900 dark:text-white">Process Staff Payroll</h3>
        <button type="button" data-drawer-close="payroll-drawer" aria-controls="payroll-drawer"
          class="cursor-pointer text-neutral-400 hover:text-neutral-700 dark:hover:text-white p-1 rounded-lg hover:bg-neutral-100 dark:hover:bg-neutral-800 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="payroll-form" class="space-y-3.5 text-xs font-semibold" onsubmit="event.preventDefault();">
        <div>
          <label for="payroll-staff-select" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Select Staff Member *</label>
          <select id="payroll-staff-select" required
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
            <option value="" disabled selected>-- Choose staff --</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="payroll-salary-type" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Rate Type</label>
            <select id="payroll-salary-type"
              class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
              <option value="daily" selected>Daily Rate</option>
              <option value="monthly">Monthly Fixed</option>
              <option value="hourly">Hourly Rate</option>
            </select>
          </div>
          <div>
            <label for="payroll-base-rate" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Base Rate (₱) *</label>
            <input type="number" step="0.01" min="0" id="payroll-base-rate" required placeholder="500.00"
              class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white font-mono font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label for="payroll-days-worked" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Days Worked</label>
            <input type="number" step="0.5" min="0.5" id="payroll-days-worked" value="6" required
              class="w-full px-3 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white font-mono font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
          <div>
            <label for="payroll-bonuses" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Bonus (₱)</label>
            <input type="number" step="0.01" min="0" id="payroll-bonuses" value="0.00"
              class="w-full px-3 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white font-mono font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
          <div>
            <label for="payroll-deductions" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Deduct (₱)</label>
            <input type="number" step="0.01" min="0" id="payroll-deductions" value="0.00"
              class="w-full px-3 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white font-mono font-bold focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
        </div>

        <div class="p-3 bg-emerald-50 dark:bg-emerald-950/30 rounded-xl border border-emerald-200 dark:border-emerald-800 flex justify-between items-center">
          <span class="font-bold text-emerald-800 dark:text-emerald-300 text-xs">Calculated Net Pay:</span>
          <span id="payroll-calculated-netpay" class="font-black text-lg text-emerald-700 dark:text-emerald-400 font-mono">₱3,000.00</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="payroll-period-start" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Period Start</label>
            <input type="date" id="payroll-period-start"
              class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
          <div>
            <label for="payroll-period-end" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Period End</label>
            <input type="date" id="payroll-period-end"
              class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
          </div>
        </div>

        <div>
          <label for="payroll-notes" class="block text-neutral-700 dark:text-neutral-300 font-bold mb-1">Notes / Remarks</label>
          <input type="text" id="payroll-notes" placeholder="e.g. Regular weekly wage + overtime"
            class="w-full px-3.5 py-2.5 bg-neutral-50 dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-700 rounded-xl text-neutral-900 dark:text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
        </div>

        <button type="submit" id="btn-submit-payroll"
          class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-extrabold text-sm rounded-xl shadow-md transition-all flex items-center justify-center cursor-pointer mt-2">
          Generate Payroll Voucher
        </button>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
